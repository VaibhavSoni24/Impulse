# IMPULSE-HARNESS-PROBE
# Temporary Stage 3 probe configuration solely to validate declarative parsing and schema compliance.
# This is NOT IMPULSE-E0. It contains no retrieval, no sub-agents, no LoRA, and no specialized prompts.

name: impulse_harness_probe
model: gemma-4-31b-it-qat-w4a16-ct
description: Minimal Stage 3 harness probe to verify schema compilation and tool resolution.
instruction: You are an autonomous software engineering agent evaluating a repository issue. Use available tools to inspect code and submit a patch when resolved.
tools:
  - run_command
  - submit_patch
generate_content_config:
  temperature: 0.2
  top_p: 0.95
  max_output_tokens: 16384
  thinking_config:
    thinking_level: high
    thinking_budget: 4096
    include_thoughts: true
